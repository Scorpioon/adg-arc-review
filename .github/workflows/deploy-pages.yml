name: Deploy Pages (review)

# TG006H Scope B: review-phase-only GitHub Pages deployment, manually
# triggered (workflow_dispatch) rather than on every push to main. The app
# lives in the nested ./adg-arc directory, not the outer repo root.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment in flight at a time; do not cancel one that is
# already running mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: adg-arc/package-lock.json

      - name: Install dependencies
        working-directory: adg-arc
        run: npm ci

      # Derives the GitHub Pages project subpath from the actual repository
      # name at run time (owner/repo from GITHUB_REPOSITORY) rather than a
      # hardcoded/assumed repo name, per the handoff.
      - name: Determine Pages base path
        id: pages-base
        run: echo "base=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"

      - name: Build (Pages base)
        working-directory: adg-arc
        env:
          VITE_BASE: ${{ steps.pages-base.outputs.base }}
          # TG006H corrective pass: the temporary board-review Pages build must
          # be product-visible 1:1 with the accepted local DEV review
          # experience, including Developer Tools and the D hotkey. Scoped to
          # this review-only workflow; the final production-host DevTools
          # policy is not decided here and may disable them later.
          VITE_ENABLE_DEVTOOLS: "true"
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: adg-arc/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
